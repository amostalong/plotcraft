[package]
name = "plotcraft"
version = "0.1.0"
description = "面向独立 / 业余 RPG / VN 创作者的 AI 协作桌面工具"
authors = ["amostalong"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` suffix 避免与 bin name 冲突（Windows 特定问题）
name = "plotcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# release 用 incremental：v0.1 增量编译比 clean 快很多
[profile.release]
incremental = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 严格 pin =2.11.1 —— 必须跟 @tauri-apps/api (npm) 同号，避免版本错配 panic
tauri = { version = "=2.11.1", features = [] }
# dialog plugin，跟 @tauri-apps/plugin-dialog (npm) 同号
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Windows 多线程小对象分配，mimalloc 性能显著优于系统堆
mimalloc = { version = "0.1", features = ["override"] }
thiserror = "2"

# commit 2: LLM 流式管道
# reqwest 用 rustls-tls 避免 Windows OpenSSL 编译问题
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

# commit 8: Locus import —— 跨 app 读 Locus config.json + custom_providers.json
# dirs 拿 OS config dir（Windows: %APPDATA%, macOS: ~/Library/Application Support, Linux: ~/.config）
dirs = "5"

# v0.1.4+ models.dev 内置 catalog snapshot（gzipped 157KB，~167 providers / ~1500 models）
# flate2 解 gzip，serde_json 解析
flate2 = "1"
# indexmap 保留 models.dev slim snapshot 的 key 顺序（provider / model 列表按 API 文档序）
indexmap = { version = "2", features = ["serde"] }
# catalog 写盘 + fetched_at ISO 8601 时间戳
chrono = { version = "0.4", features = ["serde"] }
